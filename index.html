<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="calculator-wrapper">
            <div class="header">
                <h1>🧮 Ultra Calculator</h1>
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="standard">Standard</button>
                    <button class="mode-btn" data-mode="scientific">Scientific</button>
                    <button class="mode-btn" data-mode="programmer">Programmer</button>
                    <button class="mode-btn" data-mode="converter">Converter</button>
                </div>
            </div>
            <div class="display-area">
                <div class="history-display" id="historyDisplay"></div>
                <input type="text" id="display" class="calculator-display" placeholder="0" readonly>
            </div>
            <div class="mode-content" id="standard-mode">
                <div class="button-grid">
                    <button class="btn function-btn" data-action="clear">AC</button>
                    <button class="btn function-btn" data-action="delete">DEL</button>
                    <button class="btn function-btn" data-action="toggleSign">±</button>
                    <button class="btn operator-btn" data-operator="/">÷</button>
                    <button class="btn number-btn">7</button>
                    <button class="btn number-btn">8</button>
                    <button class="btn number-btn">9</button>
                    <button class="btn operator-btn" data-operator="*">×</button>
                    <button class="btn number-btn">4</button>
                    <button class="btn number-btn">5</button>
                    <button class="btn number-btn">6</button>
                    <button class="btn operator-btn" data-operator="-">−</button>
                    <button class="btn number-btn">1</button>
                    <button class="btn number-btn">2</button>
                    <button class="btn number-btn">3</button>
                    <button class="btn operator-btn" data-operator="+">+</button>
                    <button class="btn number-btn">0</button>
                    <button class="btn number-btn">.</button>
                    <button class="btn operator-btn" data-operator="%">%</button>
                    <button class="btn equals-btn" data-action="equals">=</button>
                </div>
            </div>
            <div class="mode-content hidden" id="scientific-mode">
                <div class="button-grid">
                    <button class="btn function-btn" data-action="clear">AC</button>
                    <button class="btn sci-btn" data-action="sin">sin</button>
                    <button class="btn sci-btn" data-action="cos">cos</button>
                    <button class="btn sci-btn" data-action="tan">tan</button>
                    <button class="btn sci-btn" data-action="log">log</button>
                    <button class="btn sci-btn" data-action="ln">ln</button>
                    <button class="btn sci-btn" data-action="sqrt">√</button>
                    <button class="btn sci-btn" data-action="factorial">n!</button>
                    <button class="btn sci-btn" data-action="pi">π</button>
                    <button class="btn number-btn">0</button>
                    <button class="btn number-btn">1</button>
                    <button class="btn number-btn">2</button>
                    <button class="btn number-btn">3</button>
                    <button class="btn number-btn">4</button>
                    <button class="btn number-btn">5</button>
                    <button class="btn operator-btn" data-operator="+">+</button>
                    <button class="btn operator-btn" data-operator="-">-</button>
                    <button class="btn operator-btn" data-operator="*">×</button>
                    <button class="btn operator-btn" data-operator="/">÷</button>
                    <button class="btn equals-btn" data-action="equals">=</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
